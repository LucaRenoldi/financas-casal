<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerar Ícones — Finanças Casal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0A0A0B;
      color: #F0F0F5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      gap: 24px;
    }
    h2 { margin: 0; font-size: 18px; color: #8888A0; }
    canvas { border-radius: 22%; box-shadow: 0 0 0 1px rgba(255,255,255,0.1); }
    button {
      padding: 14px 28px;
      background: #00C896;
      border: none;
      border-radius: 12px;
      color: #000;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
    p { font-size: 13px; color: #44445A; margin: 0; }
  </style>
</head>
<body>
  <h2>Preview do ícone (192×192)</h2>
  <canvas id="preview" width="192" height="192"></canvas>
  <button onclick="download()">⬇ Baixar icon-192.png e icon-512.png</button>
  <p>Depois mova os dois arquivos para a pasta <b style="color:#00C896">public/</b> e sobrescreva os antigos.</p>

  <script>
    function draw(canvas) {
      const size = canvas.width
      const ctx  = canvas.getContext('2d')

      // Fundo verde
      ctx.fillStyle = '#00C896'
      ctx.fillRect(0, 0, size, size)

      // "C" geométrico branco
      const cx     = size / 2
      const cy     = size / 2 + size * 0.02   // ligeiramente centralizado visualmente
      const radius = size * 0.295
      const lw     = size * 0.135
      const gap    = Math.PI / 4              // ±45° de abertura à direita

      ctx.beginPath()
      ctx.arc(cx, cy, radius, gap, -gap, false)
      ctx.strokeStyle = 'white'
      ctx.lineWidth   = lw
      ctx.lineCap     = 'round'
      ctx.stroke()
    }

    draw(document.getElementById('preview'))

    function download() {
      [192, 512].forEach((size, i) => {
        const canvas = document.createElement('canvas')
        canvas.width  = size
        canvas.height = size
        draw(canvas)
        setTimeout(() => {
          const a      = document.createElement('a')
          a.href       = canvas.toDataURL('image/png')
          a.download   = `icon-${size}.png`
          a.click()
        }, i * 400)
      })
    }
  </script>
</body>
</html>
