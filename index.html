<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Finanças do Casal 💚</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#1D9E75"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Casal 💚"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<meta name="description" content="Gestão financeira a dois — despesas, caixinhas e objetivos juntos"/>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<style>
:root{
  --teal:#1D9E75;--teal-l:#E1F5EE;--teal-d:#085041;--teal-glow:rgba(29,158,117,.3);
  --pink:#D4537E;--pink-l:#FBEAF0;
  --purple:#7F77DD;--purple-l:#EEEDFE;
  --amber:#BA7517;--amber-l:#FAEEDA;
  --red:#E24B4A;
  --bg:#FAFAF8;--bg2:#F1EFE8;--bg3:#fff;
  --text:#1a1a18;--text2:#5F5E5A;--text3:#B4B2A9;
  --border:rgba(0,0,0,.09);--border2:rgba(0,0,0,.16);
  --r:14px;--r-sm:10px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
  --nav-h:calc(60px + var(--safe-bot));
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#111113;--bg2:#1C1C1E;--bg3:#242426;
    --text:#F2F2F0;--text2:#9A9A96;--text3:#48484A;
    --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.15);
    --teal-l:#04342C;--pink-l:#3A0E1E;--purple-l:#1A1740;--amber-l:#2E1A02;
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overscroll-behavior:none;}
body{
  font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
input,select,button{font-family:inherit;}

/* —— AUTH —— */
#auth-screen{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:max(1rem,var(--safe-top)) 1rem max(1rem,var(--safe-bot));
  background:var(--bg);overflow-y:auto;z-index:10;
}
.auth-card{
  background:var(--bg3);border:1px solid var(--border);border-radius:24px;
  padding:2.5rem 1.75rem;width:100%;max-width:420px;
}
.auth-logo{text-align:center;margin-bottom:2rem;}
.auth-logo h1{font-family:'DM Serif Display',serif;font-size:30px;color:var(--teal);}
.auth-logo p{font-size:14px;color:var(--text2);margin-top:6px;}
.auth-tabs{display:flex;background:var(--bg2);border-radius:var(--r-sm);padding:3px;gap:3px;margin-bottom:1.5rem;}
.auth-tab{flex:1;padding:9px;border:none;border-radius:8px;background:transparent;font-size:14px;font-weight:500;color:var(--text2);transition:all .15s;}
.auth-tab.active{background:var(--bg3);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.1);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:5px;letter-spacing:.5px;text-transform:uppercase;}
.field input{width:100%;padding:13px 16px;border:1.5px solid var(--border);border-radius:var(--r-sm);background:var(--bg2);font-size:16px;color:var(--text);outline:none;transition:border-color .15s;}
.field input:focus{border-color:var(--teal);}
.btn-primary{width:100%;padding:14px;background:var(--teal);color:#fff;border:none;border-radius:var(--r-sm);font-size:15px;font-weight:600;transition:opacity .15s;}
.btn-primary:active{opacity:.8;}
.btn-primary:disabled{opacity:.55;}
.auth-err{font-size:13px;color:var(--red);text-align:center;margin-top:10px;min-height:18px;}

/* —— APP SHELL —— */
#app-screen{position:fixed;inset:0;display:none;flex-direction:column;}
.app-hdr{
  height:calc(56px + var(--safe-top));
  padding:calc(var(--safe-top) + 10px) 1rem 10px;
  display:flex;align-items:center;justify-content:space-between;
  background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;z-index:5;
}
.app-logo{font-family:'DM Serif Display',serif;font-size:21px;color:var(--teal);}
.hdr-r{display:flex;align-items:center;gap:8px;}
.user-chip{display:flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--border);border-radius:99px;padding:4px 12px 4px 4px;}
.uav{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:#9FE1CB;color:#085041;}
.uname{font-size:13px;font-weight:500;}
.hdr-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:16px;}

/* scrollable area */
.app-body{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:var(--nav-h);-webkit-overflow-scrolling:touch;}
.inner{max-width:600px;margin:0 auto;padding:0 1rem;}

/* bottom nav */
.bnav{
  position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);
  background:var(--bg3);border-top:1px solid var(--border);
  display:flex;align-items:flex-start;padding-top:6px;z-index:10;
}
.ni{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  border:none;background:none;color:var(--text3);font-size:10px;font-weight:500;
  padding:0 2px;letter-spacing:.2px;
}
.ni.active{color:var(--teal);}
.ni-ic{font-size:22px;line-height:1.1;}

/* fab */
.fab{
  position:fixed;bottom:calc(var(--nav-h) + 12px);
  right:max(16px,calc(50vw - 284px));
  width:52px;height:52px;background:var(--teal);color:#fff;border:none;border-radius:50%;
  font-size:25px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 18px var(--teal-glow);z-index:9;transition:transform .15s;
}
.fab:active{transform:scale(.92);}

/* screens */
.screen{display:none;padding-top:1rem;}
.screen.active{display:block;}

/* month strip */
.month-strip{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;}
.month-lbl{font-size:16px;font-weight:600;}
.mnav{display:flex;gap:6px;}
.mbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--bg2);font-size:18px;display:flex;align-items:center;justify-content:center;}

/* segmented */
.seg{display:flex;background:var(--bg2);border-radius:var(--r-sm);padding:3px;gap:3px;margin-bottom:1rem;}
.stab{flex:1;padding:8px 4px;border:none;border-radius:8px;background:transparent;font-size:13px;font-weight:500;color:var(--text2);transition:all .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stab.active{background:var(--bg3);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.1);}

/* metrics */
.mrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem;}
.met{background:var(--bg2);border-radius:var(--r-sm);padding:11px 10px;}
.met-l{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.met-v{font-size:16px;font-weight:700;line-height:1.15;}
.g{color:var(--teal);}.r{color:var(--red);}.p{color:var(--purple);}

/* card */
.card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:1rem;margin-bottom:10px;}
.card-hd{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
.card-lnk{font-size:12px;font-weight:500;color:var(--teal);text-transform:none;letter-spacing:0;cursor:pointer;}

/* split bar */
.split-bar{height:10px;border-radius:99px;overflow:hidden;display:flex;margin:8px 0;}
.sb-a{background:var(--teal);transition:width .4s;}
.sb-b{background:var(--pink);transition:width .4s;}
.split-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);}

/* pie */
.pie-wrap{position:relative;width:170px;height:170px;margin:0 auto 1rem;}
.pie-leg{display:flex;flex-direction:column;gap:7px;}
.leg-r{display:flex;align-items:center;gap:8px;font-size:13px;}
.leg-d{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.leg-p{margin-left:auto;font-weight:700;font-size:13px;}

/* expense row */
.exp-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--border);}
.exp-row:last-child{border-bottom:none;padding-bottom:0;}
.exp-ic{width:38px;height:38px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.exp-inf{flex:1;min-width:0;}
.exp-nm{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.exp-sub{font-size:12px;color:var(--text2);margin-top:1px;display:flex;align-items:center;gap:5px;}
.pill{font-size:10px;font-weight:600;padding:1px 6px;border-radius:99px;background:var(--purple-l);color:var(--purple);}
.exp-rr{text-align:right;flex-shrink:0;}
.exp-amt{font-size:14px;font-weight:700;}
.exp-dt{font-size:11px;color:var(--text3);margin-top:1px;}

/* box row */
.box-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
.box-row:last-child{border-bottom:none;padding-bottom:0;}
.box-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
.box-inf{flex:1;min-width:0;}
.box-nm{font-size:14px;font-weight:500;}
.box-mt{font-size:11px;color:var(--text2);margin-top:1px;}
.box-pb{height:4px;background:var(--bg2);border-radius:99px;margin-top:7px;overflow:hidden;}
.box-pf{height:100%;border-radius:99px;transition:width .4s;}
.box-rr{text-align:right;flex-shrink:0;}
.box-cv{font-size:13px;font-weight:700;}
.box-gl{font-size:11px;color:var(--text2);}
.box-pc{font-size:11px;font-weight:700;margin-top:1px;}

/* partner */
.pcode{background:var(--bg2);border-radius:var(--r-sm);padding:14px;font-family:monospace;font-size:22px;font-weight:700;letter-spacing:5px;text-align:center;color:var(--teal);margin:10px 0;}
.btn-ol{width:100%;padding:12px;background:transparent;border:1.5px solid var(--border2);border-radius:var(--r-sm);font-size:14px;font-weight:500;color:var(--text);transition:all .15s;}
.btn-ol:active{border-color:var(--teal);color:var(--teal);}

/* modal */
.mov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;backdrop-filter:blur(3px);animation:fi .15s;}
@keyframes fi{from{opacity:0}to{opacity:1}}
.mbox{background:var(--bg3);border-radius:22px 22px 0 0;width:100%;max-width:600px;padding:1.25rem 1.25rem max(1.5rem,var(--safe-bot));animation:su .2s cubic-bezier(.2,.8,.4,1);max-height:90dvh;overflow-y:auto;}
@keyframes su{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.mhdl{width:36px;height:4px;background:var(--border2);border-radius:99px;margin:0 auto 1.25rem;}
.mtit{font-size:18px;font-weight:600;margin-bottom:1.25rem;}
.mf{margin-bottom:12px;}
.ml{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;}
.mi{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:var(--r-sm);background:var(--bg2);font-size:16px;color:var(--text);outline:none;}
.mi:focus{border-color:var(--teal);}
.mr2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mck{display:flex;align-items:center;gap:9px;font-size:14px;margin-bottom:12px;cursor:pointer;}
.mck input{width:18px;height:18px;accent-color:var(--teal);}
.macts{display:flex;gap:8px;margin-top:8px;}
.mcanc{flex:1;padding:13px;background:var(--bg2);border:none;border-radius:var(--r-sm);font-size:14px;font-weight:500;color:var(--text2);}
.msave{flex:2;padding:13px;background:var(--teal);border:none;border-radius:var(--r-sm);font-size:14px;font-weight:600;color:#fff;}
.msave:active{opacity:.85;}

/* toast */
.toast{position:fixed;top:max(16px,var(--safe-top));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 22px;border-radius:99px;font-size:13px;font-weight:500;z-index:300;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}

/* empty */
.empty{text-align:center;padding:2.5rem 1rem;color:var(--text2);font-size:14px;line-height:1.7;}
.ei{font-size:36px;display:block;margin-bottom:8px;}
.loading{text-align:center;padding:2rem;color:var(--text3);font-size:14px;}

/* update banner */
.updbanner{position:fixed;top:max(12px,var(--safe-top));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:10px;z-index:200;}
.updbanner button{background:var(--teal);color:#fff;border:none;padding:5px 12px;border-radius:99px;font-size:12px;font-weight:600;}

/* desktop sidebar nav */
@media(min-width:900px){
  #app-screen{flex-direction:row;}
  .bnav{position:relative;width:220px;height:100%;border-top:none;border-right:1px solid var(--border);flex-direction:column;align-items:flex-start;padding:1.5rem 0;gap:2px;}
  .ni{flex:none;width:100%;flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 20px;font-size:14px;border-radius:0;}
  .ni.active{color:var(--teal);background:var(--teal-l);}
  .ni-ic{font-size:20px;}
  .fab{position:fixed;bottom:24px;right:24px;}
  .app-body{padding-bottom:1rem;}
}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo"><h1>💚 Casal</h1><p>Gestão financeira a dois</p></div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="setAuthTab('login')">Entrar</button>
      <button class="auth-tab" onclick="setAuthTab('signup')">Criar conta</button>
    </div>
    <div id="auth-login">
      <div class="field"><label>E-mail</label><input type="email" id="l-email" inputmode="email" placeholder="seu@email.com" autocomplete="email"/></div>
      <div class="field"><label>Senha</label><input type="password" id="l-pass" placeholder="••••••••" autocomplete="current-password"/></div>
      <button class="btn-primary" id="btn-login" onclick="doLogin()">Entrar</button>
    </div>
    <div id="auth-signup" style="display:none">
      <div class="field"><label>Seu nome</label><input type="text" id="s-name" placeholder="Como quer ser chamado(a)?" autocomplete="name"/></div>
      <div class="field"><label>E-mail</label><input type="email" id="s-email" inputmode="email" placeholder="seu@email.com" autocomplete="email"/></div>
      <div class="field"><label>Senha</label><input type="password" id="s-pass" placeholder="mín. 6 caracteres" autocomplete="new-password"/></div>
      <button class="btn-primary" id="btn-signup" onclick="doSignup()">Criar minha conta</button>
    </div>
    <div class="auth-err" id="auth-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app-screen">
  <header class="app-hdr">
    <div class="app-logo">💚 Casal</div>
    <div class="hdr-r">
      <div class="user-chip"><div class="uav" id="hdr-av"></div><span class="uname" id="hdr-nm"></span></div>
      <button class="hdr-btn" onclick="doLogout()">⏎</button>
    </div>
  </header>

  <div class="app-body" id="app-body">

    <!-- HOME -->
    <div class="screen active" id="screen-home">
      <div class="inner">
        <div class="month-strip">
          <div class="month-lbl" id="mlbl"></div>
          <div class="mnav"><button class="mbtn" onclick="chMonth(-1)">‹</button><button class="mbtn" onclick="chMonth(1)">›</button></div>
        </div>
        <div class="seg">
          <button class="stab active" onclick="setHV('meu')" id="ht-meu">Meu</button>
          <button class="stab" onclick="setHV('par')" id="ht-par">Parceiro(a)</button>
          <button class="stab" onclick="setHV('jun')" id="ht-jun">Juntos</button>
        </div>
        <div class="mrow">
          <div class="met"><div class="met-l">Renda</div><div class="met-v g" id="m-rd">—</div></div>
          <div class="met"><div class="met-l">Gastos</div><div class="met-v r" id="m-gs">—</div></div>
          <div class="met"><div class="met-l">Sobrou</div><div class="met-v p" id="m-sb">—</div></div>
        </div>
        <div class="card" id="split-card" style="display:none">
          <div class="card-hd">Participação</div>
          <div class="split-bar"><div class="sb-a" id="sba"></div><div class="sb-b" id="sbb"></div></div>
          <div class="split-lbl"><span id="sbl-a"></span><span id="sbl-b"></span></div>
        </div>
        <div class="card">
          <div class="card-hd">Gastos por categoria</div>
          <div class="pie-wrap"><canvas id="pie" role="img" aria-label="Gráfico de pizza por categoria">Distribuição por categoria.</canvas></div>
          <div class="pie-leg" id="pie-leg"></div>
        </div>
        <div class="card">
          <div class="card-hd">Últimas despesas <span class="card-lnk" onclick="setNav('expenses')">ver todas</span></div>
          <div id="rec-list"><div class="loading">Carregando…</div></div>
        </div>
      </div>
    </div>

    <!-- CAIXINHAS -->
    <div class="screen" id="screen-boxes">
      <div class="inner">
        <div class="seg">
          <button class="stab active" onclick="setBV('meu')" id="bt-meu">Minhas</button>
          <button class="stab" onclick="setBV('par')" id="bt-par">Parceiro(a)</button>
          <button class="stab" onclick="setBV('cas')" id="bt-cas">Do casal</button>
        </div>
        <div id="box-list"><div class="loading">Carregando…</div></div>
      </div>
    </div>

    <!-- DESPESAS -->
    <div class="screen" id="screen-expenses">
      <div class="inner">
        <div class="seg">
          <button class="stab active" onclick="setEV('meu')" id="et-meu">Minhas</button>
          <button class="stab" onclick="setEV('par')" id="et-par">Parceiro(a)</button>
          <button class="stab" onclick="setEV('tod')" id="et-tod">Todas</button>
        </div>
        <div id="all-exp"><div class="loading">Carregando…</div></div>
      </div>
    </div>

    <!-- CASAL -->
    <div class="screen" id="screen-partner">
      <div class="inner" id="partner-ct"><div class="loading">Carregando…</div></div>
    </div>

  </div><!-- /app-body -->

  <nav class="bnav">
    <button class="ni active" id="nav-home"     onclick="setNav('home')"    ><span class="ni-ic">🏠</span>Início</button>
    <button class="ni"        id="nav-boxes"    onclick="setNav('boxes')"   ><span class="ni-ic">📦</span>Caixinhas</button>
    <button class="ni"        id="nav-expenses" onclick="setNav('expenses')"><span class="ni-ic">📋</span>Despesas</button>
    <button class="ni"        id="nav-partner"  onclick="setNav('partner')" ><span class="ni-ic">💑</span>Casal</button>
  </nav>
  <button class="fab" id="fab" onclick="openExpM()">+</button>
</div>

<!-- MODAL: despesa -->
<div class="mov" id="mod-exp" style="display:none" onclick="if(event.target===this)closeExpM()">
  <div class="mbox">
    <div class="mhdl"></div>
    <div class="mtit">Nova despesa</div>
    <div class="mf"><label class="ml">Descrição</label><input class="mi" id="e-desc" placeholder="Ex: Supermercado"/></div>
    <div class="mr2">
      <div class="mf"><label class="ml">Valor (R$)</label><input class="mi" id="e-amt" type="number" inputmode="decimal" step="0.01" placeholder="0,00"/></div>
      <div class="mf"><label class="ml">Data</label><input class="mi" id="e-dt" type="date"/></div>
    </div>
    <div class="mf"><label class="ml">Categoria</label>
      <select class="mi" id="e-cat">
        <option>Alimentação</option><option>Moradia</option><option>Transporte</option>
        <option>Lazer</option><option>Saúde</option><option>Educação</option>
        <option>Vestuário</option><option>Outros</option>
      </select>
    </div>
    <label class="mck"><input type="checkbox" id="e-sh"/> Despesa compartilhada do casal</label>
    <div class="macts">
      <button class="mcanc" onclick="closeExpM()">Cancelar</button>
      <button class="msave" onclick="saveExp()">Salvar</button>
    </div>
  </div>
</div>

<!-- MODAL: caixinha -->
<div class="mov" id="mod-box" style="display:none" onclick="if(event.target===this)closeBoxM()">
  <div class="mbox">
    <div class="mhdl"></div>
    <div class="mtit">Nova caixinha / cofrinho</div>
    <div class="mf"><label class="ml">Nome</label><input class="mi" id="b-nm" placeholder="Ex: Viagem Europa"/></div>
    <div class="mr2">
      <div class="mf"><label class="ml">Banco</label><select class="mi" id="b-bk"><option>Nubank</option><option>Itaú</option></select></div>
      <div class="mf"><label class="ml">Cor</label>
        <select class="mi" id="b-cl">
          <option value="teal">Verde</option><option value="pink">Rosa</option>
          <option value="purple">Roxo</option><option value="amber">Âmbar</option>
        </select>
      </div>
    </div>
    <div class="mr2">
      <div class="mf"><label class="ml">Valor atual (R$)</label><input class="mi" id="b-cv" type="number" inputmode="decimal" step="0.01" placeholder="0,00"/></div>
      <div class="mf"><label class="ml">Meta (R$)</label><input class="mi" id="b-gl" type="number" inputmode="decimal" step="0.01" placeholder="0,00"/></div>
    </div>
    <label class="mck"><input type="checkbox" id="b-cp"/> Objetivo do casal</label>
    <div class="macts">
      <button class="mcanc" onclick="closeBoxM()">Cancelar</button>
      <button class="msave" onclick="saveBox()">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ——————————————————————————————————————————
// ⚠️ CONFIGURE AQUI com seus dados Supabase
const SUPABASE_URL = 'https://pimuijxvmnxysgeqknjc.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpbXVpanh2bW54eXNnZXFrbmpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4ODg1MTEsImV4cCI6MjA5NDQ2NDUxMX0.J0_9k4fpLZzSoV7T9ZFcF5HruVqhfhdZ7BgGhbx9QmE';
// ——————————————————————————————————————————

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let me=null, partner=null, expCache=[], boxCache=[], pieChart=null;
let curMonth=new Date().getMonth(), curYear=new Date().getFullYear();
let hv='meu', bv='meu', ev='meu';

const MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const CC={'Alimentação':'#1D9E75','Moradia':'#D4537E','Transporte':'#7F77DD','Lazer':'#BA7517','Saúde':'#E24B4A','Educação':'#378ADD','Vestuário':'#D85A30','Outros':'#888780'};
const CI={'Alimentação':'🍽','Moradia':'🏠','Transporte':'🚗','Lazer':'🎬','Saúde':'💊','Educação':'📚','Vestuário':'👗','Outros':'💸'};
const BC={teal:'#1D9E75',pink:'#D4537E',purple:'#7F77DD',amber:'#BA7517'};

const $=id=>document.getElementById(id);
const fmt=v=>'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0});
const fmtD=v=>'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=(c,g)=>Math.min(100,Math.round(c/g*100));
const today=()=>new Date().toISOString().split('T')[0];

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

// AUTH
function setAuthTab(t){
  document.querySelectorAll('.auth-tab').forEach((b,i)=>b.classList.toggle('active',(i===0&&t==='login')||(i===1&&t==='signup')));
  $('auth-login').style.display=t==='login'?'':'none';
  $('auth-signup').style.display=t==='signup'?'':'none';
  $('auth-err').textContent='';
}
async function doLogin(){
  const btn=$('btn-login');btn.disabled=true;btn.textContent='Entrando…';
  $('auth-err').textContent='';
  const {error}=await sb.auth.signInWithPassword({email:$('l-email').value,password:$('l-pass').value});
  if(error){$('auth-err').textContent=error.message;btn.disabled=false;btn.textContent='Entrar';}
}
async function doSignup(){
  const name=$('s-name').value.trim();
  if(!name){$('auth-err').textContent='Digite seu nome';return;}
  const btn=$('btn-signup');btn.disabled=true;btn.textContent='Criando…';
  const {data,error}=await sb.auth.signUp({email:$('s-email').value,password:$('s-pass').value});
  if(error){$('auth-err').textContent=error.message;btn.disabled=false;btn.textContent='Criar minha conta';return;}
  if(data.user){
    const ini=name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
    const code=Math.random().toString(36).slice(2,8).toUpperCase();
    await sb.from('profiles').insert({id:data.user.id,name,avatar_initials:ini,couple_code:code});
    toast('Conta criada! 🎉');setAuthTab('login');btn.disabled=false;btn.textContent='Criar minha conta';
  }
}
async function doLogout(){await sb.auth.signOut();}

sb.auth.onAuthStateChange(async(ev,session)=>{
  if(session){
    await loadProfile(session.user.id);
    $('auth-screen').style.display='none';
    $('app-screen').style.display='flex';
    await loadAll();
  } else {
    $('auth-screen').style.display='flex';
    $('app-screen').style.display='none';
    me=null;partner=null;
  }
});

async function loadProfile(uid){
  const {data}=await sb.from('profiles').select('*').eq('id',uid).single();
  me=data;
  if(me?.partner_id){const {data:p}=await sb.from('profiles').select('*').eq('id',me.partner_id).single();partner=p;}
  renderHdr();
}

function renderHdr(){
  if(!me)return;
  $('hdr-av').textContent=me.avatar_initials;
  $('hdr-nm').textContent=me.name.split(' ')[0];
  const pn=partner?partner.name.split(' ')[0]:'Parceiro(a)';
  $('ht-par').textContent=pn;$('bt-par').textContent=pn;$('et-par').textContent=pn;
}

async function loadAll(){
  $('mlbl').textContent=MONTHS[curMonth]+' '+curYear;
  await Promise.all([loadExp(),loadBox()]);
  renderHome();renderBoxList();renderExpList();renderPartner();
}

async function loadExp(){
  const uids=[me.id];if(partner)uids.push(partner.id);
  const m=String(curMonth+1).padStart(2,'0');
  const {data}=await sb.from('expenses').select('*').in('user_id',uids)
    .gte('expense_date',`${curYear}-${m}-01`).lte('expense_date',`${curYear}-${m}-31`)
    .order('expense_date',{ascending:false});
  expCache=data||[];
}
async function loadBox(){
  const uids=[me.id];if(partner)uids.push(partner.id);
  const {data}=await sb.from('boxes').select('*').in('user_id',uids).order('created_at');
  boxCache=data||[];
}

// HOME
function setHV(v){
  hv=v;
  [['ht-meu','meu'],['ht-par','par'],['ht-jun','jun']].forEach(([id,val])=>$(id).classList.toggle('active',val===v));
  renderHome();
}
function renderHome(){
  const myE=expCache.filter(e=>e.user_id===me.id);
  const parE=partner?expCache.filter(e=>e.user_id===partner.id):[];
  const exp=hv==='meu'?myE:hv==='par'?parE:expCache;
  const tot=exp.reduce((s,e)=>s+Number(e.amount),0);
  $('m-rd').textContent='—';$('m-gs').textContent=fmt(tot);$('m-sb').textContent='—';

  const sc=$('split-card');
  if(hv==='jun'&&partner){
    sc.style.display='block';
    const mt=myE.reduce((s,e)=>s+Number(e.amount),0);
    const pt=parE.reduce((s,e)=>s+Number(e.amount),0);
    const tot2=mt+pt||1;const mp=Math.round(mt/tot2*100);
    $('sba').style.width=mp+'%';$('sbb').style.width=(100-mp)+'%';
    $('sbl-a').textContent=me.name.split(' ')[0]+' '+mp+'%';
    $('sbl-b').textContent=partner.name.split(' ')[0]+' '+(100-mp)+'%';
  } else sc.style.display='none';

  renderPie(exp);
  renderRecent(exp.slice(0,5));
}

function renderPie(exp){
  const cats={};
  exp.forEach(e=>{cats[e.category]=(cats[e.category]||0)+Number(e.amount);});
  const ent=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const tot=ent.reduce((s,[,v])=>s+v,0)||1;
  if(pieChart){pieChart.destroy();pieChart=null;}
  const ctx=$('pie');
  if(!ent.length){
    ctx.parentElement.style.display='none';
    $('pie-leg').innerHTML='<div class="empty"><span class="ei">📊</span>Sem despesas neste período</div>';return;
  }
  ctx.parentElement.style.display='block';
  const isDark=window.matchMedia('(prefers-color-scheme:dark)').matches;
  pieChart=new Chart(ctx,{
    type:'doughnut',
    data:{labels:ent.map(([k])=>k),datasets:[{data:ent.map(([,v])=>v),backgroundColor:ent.map(([k])=>CC[k]||'#888'),borderWidth:3,borderColor:isDark?'#242426':'#fff'}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'60%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${fmtD(c.raw)} (${Math.round(c.raw/tot*100)}%)`}}}}
  });
  $('pie-leg').innerHTML=ent.map(([cat,val])=>`
    <div class="leg-r"><span class="leg-d" style="background:${CC[cat]||'#888'}"></span>
    <span>${CI[cat]||'💸'} ${cat}</span>
    <span class="leg-p" style="color:${CC[cat]||'#888'}">${Math.round(val/tot*100)}%</span></div>`).join('');
}

function expRow(e){
  const isMe=e.user_id===me.id;
  const col=isMe?'#1D9E75':'#D4537E';
  const d=new Date(e.expense_date+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
  return `<div class="exp-row">
    <div class="exp-ic" style="background:${CC[e.category]||'#888'}22">${CI[e.category]||'💸'}</div>
    <div class="exp-inf">
      <div class="exp-nm">${e.description}</div>
      <div class="exp-sub" style="color:${col}">${e.category}${e.is_shared?'<span class="pill">casal</span>':''}</div>
    </div>
    <div class="exp-rr"><div class="exp-amt">−${fmtD(e.amount)}</div><div class="exp-dt">${d}</div></div>
  </div>`;
}
function renderRecent(list){
  $('rec-list').innerHTML=list.length?list.map(expRow).join(''):'<div class="empty"><span class="ei">🎉</span>Nenhuma despesa este mês!</div>';
}

// BOXES
function setBV(v){
  bv=v;
  [['bt-meu','meu'],['bt-par','par'],['bt-cas','cas']].forEach(([id,val])=>$(id).classList.toggle('active',val===v));
  $('fab').onclick=v==='cas'?openBoxM:openExpM;
  renderBoxList();
}
function renderBoxList(){
  const list=bv==='meu'?boxCache.filter(b=>b.user_id===me.id&&!b.is_couple_goal)
    :bv==='par'?boxCache.filter(b=>b.user_id!==me.id&&!b.is_couple_goal)
    :boxCache.filter(b=>b.is_couple_goal);
  if(!list.length){$('box-list').innerHTML='<div class="card"><div class="empty"><span class="ei">📦</span>Nenhuma caixinha ainda<br>Toque no + para criar</div></div>';return;}
  $('box-list').innerHTML='<div class="card">'+list.map(b=>{
    const p=pct(b.current_amount,b.goal_amount);const col=BC[b.color]||'#1D9E75';
    return `<div class="box-row">
      <div class="box-dot" style="background:${col}"></div>
      <div class="box-inf"><div class="box-nm">${b.name}</div><div class="box-mt">${b.bank}${b.is_couple_goal?' · 💑':''}</div>
        <div class="box-pb"><div class="box-pf" style="width:${p}%;background:${col}"></div></div>
      </div>
      <div class="box-rr"><div class="box-cv" style="color:${col}">${fmt(b.current_amount)}</div>
        <div class="box-gl">de ${fmt(b.goal_amount)}</div>
        <div class="box-pc" style="color:${col}">${p}%</div>
      </div>
    </div>`;
  }).join('')+'</div>';
}

// EXPENSES LIST
function setEV(v){
  ev=v;
  [['et-meu','meu'],['et-par','par'],['et-tod','tod']].forEach(([id,val])=>$(id).classList.toggle('active',val===v));
  renderExpList();
}
function renderExpList(){
  const list=ev==='meu'?expCache.filter(e=>e.user_id===me.id):ev==='par'?expCache.filter(e=>e.user_id!==me.id):expCache;
  $('all-exp').innerHTML=list.length?'<div class="card">'+list.map(expRow).join('')+'</div>':'<div class="empty"><span class="ei">✨</span>Sem despesas neste período</div>';
}

// PARCEIRO
function renderPartner(){
  const el=$('partner-ct');
  if(!partner){
    el.innerHTML=`
      <div class="card"><div class="card-hd">Seu código de convite</div>
        <p style="font-size:13px;color:var(--text2);margin-bottom:6px">Compartilhe com sua namorada para conectar as contas.</p>
        <div class="pcode">${me?.couple_code||'...'}</div>
        <button class="btn-ol" onclick="copyCode()">📋 Copiar código</button>
      </div>
      <div class="card" style="margin-top:10px"><div class="card-hd">Tenho um código</div>
        <div class="mf"><label class="ml">Código do(a) parceiro(a)</label>
          <input class="mi" id="p-inp" placeholder="ABC123" maxlength="6" style="text-transform:uppercase;letter-spacing:4px;font-size:20px;text-align:center"/>
        </div>
        <button class="msave" style="width:100%;padding:13px;border-radius:var(--r-sm)" onclick="linkPartner()">Vincular 💑</button>
      </div>`;
  } else {
    el.innerHTML=`
      <div class="card"><div class="card-hd">💑 Conectados</div>
        <div style="display:flex;align-items:center;gap:14px;padding:8px 0">
          <div class="uav" style="width:50px;height:50px;font-size:16px;background:#F4C0D1;color:#4B1528">${partner.avatar_initials}</div>
          <div><div style="font-size:17px;font-weight:600">${partner.name}</div>
            <div style="font-size:13px;color:var(--text2);margin-top:2px">Código: ${partner.couple_code}</div></div>
        </div>
        <div style="margin-top:10px;padding:10px 14px;background:var(--teal-l);border-radius:var(--r-sm);font-size:13px;color:var(--teal);font-weight:500">
          ✓ Vocês estão vinculados e compartilham os dados
        </div>
      </div>`;
  }
}
async function copyCode(){await navigator.clipboard.writeText(me?.couple_code||'');toast('Código copiado! 📋');}
async function linkPartner(){
  const code=$('p-inp').value.trim().toUpperCase();
  if(code.length<6){toast('Digite o código completo');return;}
  const {data,error}=await sb.rpc('link_partner',{code});
  if(error||data?.error){toast(data?.error||error.message);return;}
  toast('Vinculado(a) com sucesso! 💑');
  await loadProfile(me.id);renderPartner();renderHdr();await loadAll();
}

// MODALS
function openExpM(){$('e-dt').value=today();$('mod-exp').style.display='flex';}
function closeExpM(){$('mod-exp').style.display='none';}
async function saveExp(){
  const desc=$('e-desc').value.trim();const amt=parseFloat($('e-amt').value);
  if(!desc||!amt||amt<=0){toast('Preencha descrição e valor');return;}
  const {error}=await sb.from('expenses').insert({user_id:me.id,description:desc,amount:amt,category:$('e-cat').value,expense_date:$('e-dt').value,is_shared:$('e-sh').checked});
  if(error){toast('Erro: '+error.message);return;}
  closeExpM();$('e-desc').value='';$('e-amt').value='';toast('Despesa salva! 💸');await loadAll();
}

function openBoxM(){$('mod-box').style.display='flex';}
function closeBoxM(){$('mod-box').style.display='none';}
async function saveBox(){
  const name=$('b-nm').value.trim();const goal=parseFloat($('b-gl').value);
  if(!name||!goal){toast('Preencha nome e meta');return;}
  const {error}=await sb.from('boxes').insert({user_id:me.id,name,bank:$('b-bk').value,color:$('b-cl').value,current_amount:parseFloat($('b-cv').value)||0,goal_amount:goal,is_couple_goal:$('b-cp').checked});
  if(error){toast('Erro: '+error.message);return;}
  closeBoxM();$('b-nm').value='';$('b-cv').value='';$('b-gl').value='';toast('Caixinha criada! 📦');await loadBox();renderBoxList();
}

// NAV
function setNav(s){
  ['home','boxes','expenses','partner'].forEach(n=>{
    $('screen-'+n).classList.toggle('active',n===s);
    $('nav-'+n).classList.toggle('active',n===s);
  });
  $('fab').style.display=s==='partner'?'none':'flex';
  if(s==='boxes')$('fab').onclick=bv==='cas'?openBoxM:openExpM;
  else $('fab').onclick=openExpM;
  $('app-body').scrollTo({top:0,behavior:'smooth'});
}
function chMonth(d){
  curMonth+=d;
  if(curMonth>11){curMonth=0;curYear++;}if(curMonth<0){curMonth=11;curYear--;}
  loadAll();
}

// PWA — Service Worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing;
      nw.addEventListener('statechange',()=>{
        if(nw.state==='installed'&&navigator.serviceWorker.controller){
          const b=document.createElement('div');
          b.className='updbanner';
          b.innerHTML='Nova versão disponível <button onclick="this.closest(\'.updbanner\').remove();nw.postMessage(\'skipWaiting\');location.reload()">Atualizar</button>';
          document.body.appendChild(b);
        }
      });
    });
  });
}
</script>
</body>
</html>
